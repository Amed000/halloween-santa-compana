<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Historia</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding" [fullscreen]="true">
  @for (a of apartados; track a.titulo) {
    <lib-monster-card
      [titulo]="a.titulo"
      [imagen]="a.imagen"
      [texto]="a.texto"
      textoBoton="Leer más" />
  }
</ion-content>
